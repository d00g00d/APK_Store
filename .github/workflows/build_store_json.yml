name: Build Store JSON Catalog

on:
  repository_dispatch:
    types: [rebuild-store-json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public store repo (APK_Store)
        uses: actions/checkout@v4

      - name: Write updated store.json
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          store_path = Path("store.json")
          payload_raw = os.environ.get("DISPATCH_PAYLOAD", "")
          payload = json.loads(payload_raw) if payload_raw and payload_raw != "null" else {}

          if "catalog" in payload and isinstance(payload["catalog"], dict):
              store_path.write_text(
                  json.dumps(payload["catalog"], ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("store.json обновлён из dispatch payload.")
          else:
              existing = json.loads(store_path.read_text(encoding="utf-8")) if store_path.exists() else {"apps": []}
              existing["updatedAt"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              store_path.write_text(
                  json.dumps(existing, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("store.json подтверждён.")
          EOF

      - name: Commit store.json
        run: |
          git config user.name "Store Catalog Bot"
          git config user.email "bot@users.noreply.github.com"
          git add store.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(catalog): auto-generate store.json with all app versions [skip ci]"
            git push
          fi
